spring.application.name=backend

app.git.repositories-directory=${REPOSITORIES_DIRECTORY:./data/repositories}
app.repository.poll-interval-ms=${REPOSITORY_POLL_INTERVAL_MS:300000}
# A slow Git sync must not starve refactoring dispatch or the AI scheduler.
spring.task.scheduling.pool.size=3
app.refactoring.timeout-seconds=${REFACTORING_TIMEOUT_SECONDS:60}
app.refactoring.max-heap-mb=${REFACTORING_MAX_HEAP_MB:768}

# GitHub App - optional until we implement it
github.app-id=${GITHUB_APP_ID:4936547}
github.private-key=${GITHUB_APP_PRIVATE_KEY:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
github.app-slug=${GITHUB_APP_SLUG:}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/git_timelapse}
spring.datasource.username=${DATABASE_USERNAME:timelapse}
spring.datasource.password=${DATABASE_PASSWORD:timelapse_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# AI: free-tier-only Google AI Studio project; never enable billing on this key.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.worker-delay-ms=${AI_WORKER_DELAY_MS:60000}
app.ai.max-daily-requests=${AI_MAX_DAILY_REQUESTS:20}

app.refactoring.history-workers=${REFACTORING_HISTORY_WORKERS:2}
