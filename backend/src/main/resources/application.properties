spring.application.name=backend

app.git.repositories-directory=${REPOSITORIES_DIRECTORY:./data/repositories}
app.repository.poll-interval-ms=${REPOSITORY_POLL_INTERVAL_MS:300000}

# GitHub App - optional until we implement it
github.app-id=${GITHUB_APP_ID:4936547}
github.private-key=${GITHUB_APP_PRIVATE_KEY:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
github.app-slug=${GITHUB_APP_SLUG:}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/git_timelapse}
spring.datasource.username=${DATABASE_USERNAME:timelapse}
spring.datasource.password=${DATABASE_PASSWORD:timelapse_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
