spring.application.name=backend

app.git.repositories-directory=${REPOSITORIES_DIRECTORY:./data/repositories}

# GitHub App - optional until we implement it
github.app-id=${GITHUB_APP_ID:}
github.private-key=${GITHUB_APP_PRIVATE_KEY:}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
github.app-slug=${GITHUB_APP_SLUG:}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/myappdb}
spring.datasource.username=${DATABASE_USERNAME:myappuser}
spring.datasource.password=${DATABASE_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true